name: Build Wheels

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v0.1.2
  workflow_dispatch:  # Allow manual triggering

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-14, macos-15-intel, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # Windows: Set up vcpkg environment variables
      - name: Set up vcpkg env (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          echo "VCPKG_ROOT=C:\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append
          # Create binary cache directory
          New-Item -ItemType Directory -Force -Path C:\vcpkg\binarycache | Out-Null
          echo "VCPKG_DEFAULT_BINARY_CACHE=C:\vcpkg\binarycache" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "VCPKG_BINARY_SOURCES=clear;files,C:\vcpkg\binarycache,readwrite" | Out-File -FilePath $env:GITHUB_ENV -Append
      # Windows: Cache vcpkg installed packages
      - name: Cache vcpkg installed (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: ${{ runner.os }}-vcpkg-x64-windows-${{ hashFiles('vcpkg.json', '.github/workflows/build-wheels.yml') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-x64-windows-
      # Windows: Cache vcpkg downloads
      - name: Cache vcpkg downloads (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\downloads
          key: ${{ runner.os }}-vcpkg-downloads
          restore-keys: |
            ${{ runner.os }}-vcpkg-downloads
      # Windows: Cache MSYS2 tools (prevents re-downloading packages)
      - name: Cache vcpkg MSYS2 tools (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\downloads\tools\msys2
          key: ${{ runner.os }}-vcpkg-msys2-tools
          restore-keys: |
            ${{ runner.os }}-vcpkg-msys2-tools
      # Windows: Cache vcpkg binary cache
      - name: Cache vcpkg binary cache (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\binarycache
          key: ${{ runner.os }}-vcpkg-binarycache-x64-windows-${{ hashFiles('vcpkg.json', '.github/workflows/build-wheels.yml') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-binarycache-x64-windows-
      # Windows: Install vcpkg dependencies
      - name: Install vcpkg dependencies (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 90
        shell: pwsh
        run: |
          if (-not (Test-Path C:\vcpkg)) {
            git clone https://github.com/Microsoft/vcpkg.git C:\vcpkg
          }
          cd C:\vcpkg
          if (-not (Test-Path .\vcpkg.exe)) {
            .\bootstrap-vcpkg.bat
          }
          
          # Install all dependencies with dynamic triplet (much faster than static)
          .\vcpkg.exe install gmp:x64-windows mpfr:x64-windows flint:x64-windows pthreads:x64-windows pkgconf:x64-windows --clean-after-build
          
          # Add pkgconf to PATH for subsequent steps
          echo "C:\vcpkg\installed\x64-windows\tools\pkgconf" | Out-File -FilePath $env:GITHUB_PATH -Append
          echo "C:\vcpkg\installed\x64-windows\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Build wheels
        uses: pypa/cibuildwheel@v2.16.5
        env:
          CIBW_BUILD_VERBOSITY: 1

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  create_release:
    name: Create GitHub Release
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
          draft: false
          prerelease: false
          generate_release_notes: true

  publish_to_repo:
    name: Publish wheels to repository
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # or your default branch name

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Commit and push wheels
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/
          git commit -m "Add built wheels from ${{ github.ref_name }}" || echo "No changes to commit"
          git push
