name: Build Wheels

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v0.1.2
  workflow_dispatch:  # Allow manual triggering

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest] # add later ubuntu-latest, macos-14,

    steps:
      - uses: actions/checkout@v4

      # Linux: Cache FLINT dependencies build
      - name: Cache FLINT dependencies (Linux)
        if: runner.os == 'Linux'
        id: cache-flint
        uses: actions/cache@v4
        with:
          path: |
            /opt/flint-deps
          key: ${{ runner.os }}-flint-deps-v2-${{ hashFiles('cmake/BuildDependencies.cmake') }}
          restore-keys: |
            ${{ runner.os }}-flint-deps-v2-

      # Linux: Build FLINT and dependencies from source
      - name: Build FLINT dependencies (Linux)
        if: runner.os == 'Linux' && steps.cache-flint.outputs.cache-hit != 'true'
        run: |
          set -e  # Exit on error
          
          # Create installation directory
          sudo mkdir -p /opt/flint-deps
          sudo chown $(whoami):$(whoami) /opt/flint-deps
          
          # Set number of parallel jobs
          NPROC=$(nproc)
          echo "Building with $NPROC parallel jobs"
          
          echo "Building FLINT dependencies from source..."
          
          # Install build tools
          sudo apt-get update
          sudo apt-get install -y build-essential wget ninja-build autoconf automake libtool m4
          
          # Create build directory
          mkdir -p /tmp/flint-build
          cd /tmp/flint-build
          
          # Build GMP
          echo "==== Building GMP ===="
          wget --progress=dot:mega https://gmplib.org/download/gmp/gmp-6.3.0.tar.xz
          tar -xf gmp-6.3.0.tar.xz
          cd gmp-6.3.0
          ./configure --prefix=/opt/flint-deps --enable-cxx --with-pic --disable-shared --enable-static
          make -j$NPROC
          make install
          cd ..
          
          # Build MPFR
          echo "==== Building MPFR ===="
          wget --progress=dot:mega https://ftp.gnu.org/gnu/mpfr/mpfr-4.2.1.tar.xz
          tar -xf mpfr-4.2.1.tar.xz
          cd mpfr-4.2.1
          ./configure --prefix=/opt/flint-deps --with-gmp=/opt/flint-deps --with-pic --disable-shared --enable-static
          make -j$NPROC
          make install
          cd ..
          
          # Build FLINT
          echo "==== Building FLINT ===="
          wget --progress=dot:mega https://github.com/flintlib/flint/releases/download/v3.1.2/flint-3.1.2.tar.gz
          tar -xf flint-3.1.2.tar.gz
          cd flint-3.1.2
          ./configure --prefix=/opt/flint-deps --with-gmp=/opt/flint-deps --with-mpfr=/opt/flint-deps --disable-shared --enable-static --with-pic CFLAGS=-fPIC CXXFLAGS=-fPIC
          make -j$NPROC
          make install
          
          echo "FLINT dependencies build complete"
          
          # Verify installation
          echo "==== Verification ===="
          ls -la /opt/flint-deps/lib/
          ls -la /opt/flint-deps/include/

      # Linux: Verify cached dependencies
      - name: Verify FLINT dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "==== FLINT Dependencies Status ===="
          if [ -f /opt/flint-deps/lib/libflint.a ]; then
            echo "✓ libflint.a found"
            ls -lh /opt/flint-deps/lib/libflint.a
          else
            echo "✗ libflint.a NOT found"
            exit 1
          fi
          
          if [ -f /opt/flint-deps/lib/libgmp.a ]; then
            echo "✓ libgmp.a found"
            ls -lh /opt/flint-deps/lib/libgmp.a
          else
            echo "✗ libgmp.a NOT found"
            exit 1
          fi
          
          if [ -f /opt/flint-deps/lib/libmpfr.a ]; then
            echo "✓ libmpfr.a found"
            ls -lh /opt/flint-deps/lib/libmpfr.a
          else
            echo "✗ libmpfr.a NOT found"
            exit 1
          fi

      # Windows: Set up vcpkg environment variables
      - name: Set up vcpkg env (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          echo "VCPKG_ROOT=C:\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append
          # Create binary cache directory
          New-Item -ItemType Directory -Force -Path C:\vcpkg\binarycache | Out-Null
          echo "VCPKG_DEFAULT_BINARY_CACHE=C:\vcpkg\binarycache" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "VCPKG_BINARY_SOURCES=clear;files,C:\vcpkg\binarycache,readwrite" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Windows: Cache vcpkg installed packages
      - name: Cache vcpkg installed (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: ${{ runner.os }}-vcpkg-x64-windows-${{ hashFiles('vcpkg.json', '.github/workflows/build-wheels.yml') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-x64-windows-

      # Windows: Cache vcpkg downloads
      - name: Cache vcpkg downloads (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\downloads
          key: ${{ runner.os }}-vcpkg-downloads
          restore-keys: |
            ${{ runner.os }}-vcpkg-downloads

      # Windows: Cache MSYS2 tools (prevents re-downloading packages)
      - name: Cache vcpkg MSYS2 tools (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\downloads\tools\msys2
          key: ${{ runner.os }}-vcpkg-msys2-tools
          restore-keys: |
            ${{ runner.os }}-vcpkg-msys2-tools

      # Windows: Cache vcpkg binary cache
      - name: Cache vcpkg binary cache (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\binarycache
          key: ${{ runner.os }}-vcpkg-binarycache-x64-windows-${{ hashFiles('vcpkg.json', '.github/workflows/build-wheels.yml') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-binarycache-x64-windows-

      # Windows: Install vcpkg dependencies
      - name: Install vcpkg dependencies (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 90
        shell: pwsh
        run: |
          if (-not (Test-Path C:\vcpkg)) {
            git clone https://github.com/Microsoft/vcpkg.git C:\vcpkg
          }
          cd C:\vcpkg
          if (-not (Test-Path .\vcpkg.exe)) {
            .\bootstrap-vcpkg.bat
          }
          
          # Install all dependencies with dynamic triplet (much faster than static)
          .\vcpkg.exe install gmp:x64-windows mpfr:x64-windows flint:x64-windows arb:x64-windows pthreads:x64-windows pkgconf:x64-windows --clean-after-build
          
          # Add pkgconf to PATH for subsequent steps
          echo "C:\vcpkg\installed\x64-windows\tools\pkgconf" | Out-File -FilePath $env:GITHUB_PATH -Append
          echo "C:\vcpkg\installed\x64-windows\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.16.5
        env:
          CIBW_BUILD_VERBOSITY: 1

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  create_release:
    name: Create GitHub Release
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
          draft: false
          prerelease: false
          generate_release_notes: true