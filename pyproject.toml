[build-system]
requires = [
    "scikit-build-core>=0.3.0",
    "pybind11>=2.6.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "iobs_ngc"
version = "0.1.4"
description = "Python bindings for iobs_ngc"
requires-python = ">=3.8"
dependencies = []
readme = "README.md"

[tool.scikit-build]
cmake.minimum-version = "3.15"
cmake.build-type = "Release"
wheel.packages = ["iobs_ngc"]

# Default: build dependencies from source
[tool.scikit-build.cmake.define]
USE_SYSTEM_LIBS = "OFF"
FETCH_BOOST = "ON"

[tool.cibuildwheel]
# Build for Python 3.8-3.12
build = "cp38-* cp39-* cp310-* cp311-* cp312-*"

# Skip 32-bit builds and musllinux
skip = "*-win32 *-manylinux_i686 *-musllinux_*"

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]
before-all = [
    "brew install gmp mpfr flint boost ninja libomp",
]
repair-wheel-command = "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"

# Set deployment target to oldest supported macOS
environment = { MACOSX_DEPLOYMENT_TARGET = "14.0" }

[tool.cibuildwheel.macos.config-settings]
"cmake.define.USE_SYSTEM_LIBS" = "ON"
"cmake.define.FETCH_BOOST" = "OFF"
"cmake.define.CMAKE_OSX_DEPLOYMENT_TARGET" = "14.0"
"cmake.args" = "-G Ninja"

[tool.cibuildwheel.windows]
before-build = [
    "pip install delvewheel",
]
repair-wheel-command = "delvewheel repair --add-path C:\\vcpkg\\installed\\x64-windows\\bin -w {dest_dir} {wheel}"

[tool.cibuildwheel.windows.environment]
VCPKG_ROOT = "C:\\vcpkg"
CMAKE_TOOLCHAIN_FILE = "C:\\vcpkg\\scripts\\buildsystems\\vcpkg.cmake"
VCPKG_TARGET_TRIPLET = "x64-windows"
PKG_CONFIG_PATH = "C:\\vcpkg\\installed\\x64-windows\\lib\\pkgconfig"

[tool.cibuildwheel.windows.config-settings]
"cmake.define.CMAKE_TOOLCHAIN_FILE" = "C:\\vcpkg\\scripts\\buildsystems\\vcpkg.cmake"
"cmake.define.VCPKG_TARGET_TRIPLET" = "x64-windows"
"cmake.define.USE_SYSTEM_LIBS" = "OFF"
# Force x64 architecture
"cmake.define.CMAKE_GENERATOR_PLATFORM" = "x64"